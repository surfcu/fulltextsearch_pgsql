name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            postgres: '13'
          - php: '8.3'
            postgres: '17'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fts_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, zip, mbstring
          coverage: none
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libxml2-utils
      - run: composer install --no-interaction --no-progress
      - name: Validate appinfo/info.xml
        run: |
          curl -sSfL -o /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml
      - name: Psalm
        run: composer psalm
      - name: Integration tests
        env:
          FTSPG_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=fts_test;user=postgres;password=postgres'
        run: composer test
