name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: NC ${{ matrix.nextcloud }} / PHP ${{ matrix.php }} / PG ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Psalm 7 requires PHP 8.2.27+; PHP 8.1 checks oldest runtime behaviour, while NC 30's
          # API is checked with Psalm on PHP 8.3 (psalm.xml enforces phpVersion="8.1" syntax).
          - { nextcloud: '30', php: '8.1', postgres: '13', psalm: false }
          - { nextcloud: '30', php: '8.3', postgres: '13', psalm: true }
          - { nextcloud: '34', php: '8.3', postgres: '16', psalm: true }
          - { nextcloud: '35', php: '8.3', postgres: '17', psalm: true }
          - { nextcloud: '35', php: '8.3', postgres: '18', psalm: true }
          - { nextcloud: '35', php: '8.4', postgres: '17', psalm: true }
          - { nextcloud: '35', php: '8.5', postgres: '18', psalm: true }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fts_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, zip, mbstring
          coverage: none
      - name: Install pdftotext, catdoc, xmllint and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils catdoc libxml2-utils
          if [ ! -x "/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump" ]; then
            sudo apt-get install -y postgresql-common ca-certificates curl
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -c "${{ matrix.postgres }}" -y
            sudo apt-get install -y --no-upgrade -o Dpkg::Options::="--force-overwrite" "postgresql-client-${{ matrix.postgres }}"
          fi
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - name: Select Nextcloud API version
        run: |
          composer require --dev --no-update "nextcloud/ocp:dev-stable${{ matrix.nextcloud }}"
          if [ "${{ matrix.psalm }}" != "true" ]; then composer remove --dev --no-update vimeo/psalm; fi
      - run: composer update --no-interaction --no-progress
      - name: Validate appinfo/info.xml
        run: |
          curl -sSfL -o /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml
      - name: Psalm
        if: matrix.psalm
        run: composer psalm
      - name: Coding standard (nextcloud/coding-standard)
        # Same result on every matrix entry, so checked once.
        if: matrix.nextcloud == '35' && matrix.php == '8.3' && matrix.postgres == '17'
        run: composer cs:check
      - name: Integration tests
        env:
          FTSPG_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=fts_test;user=postgres;password=postgres'
        run: composer test

  package:
    name: AppStore packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build AppStore package
        run: make appstore
      - name: Validate package contents
        run: |
          archive="build/artifacts/appstore/fulltextsearch_pgsql.tar.gz"
          test -f "$archive" || { echo "FAIL: Archive $archive not found"; exit 1; }
          contents=$(tar -tzf "$archive")
          echo "$contents" | grep -q '^fulltextsearch_pgsql/appinfo/info\.xml$' || { echo "FAIL: Missing appinfo/info.xml in archive"; exit 1; }
          echo "$contents" | grep -q '^fulltextsearch_pgsql/lib/Vendor/Smalot/PdfParser/Parser\.php$' || { echo "FAIL: Missing lib/Vendor/Smalot/PdfParser/Parser.php in archive"; exit 1; }
          if echo "$contents" | grep -E '^fulltextsearch_pgsql/(tests/|vendor/|\.github/)'; then
            echo "FAIL: Archive contains forbidden test/dev directories (tests/, vendor/, or .github/)"
            exit 1
          fi
          echo "ok: AppStore package archive validation passed"

  pg_upgrade:
    name: pg_upgrade --check (PG 17 -> PG 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, intl, zip, mbstring
          coverage: none
      - name: Install extraction tools and PostgreSQL 17 & 18
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils catdoc postgresql-common ca-certificates curl
          sudo install -d /etc/postgresql-common/createcluster.d
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/no-main.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -c 17 -y
          pkgs="postgresql-17"
          if [ ! -x /usr/lib/postgresql/18/bin/pg_upgrade ]; then
            pkgs="$pkgs postgresql-18"
          fi
          sudo apt-get install -y --no-upgrade -o Dpkg::Options::="--force-overwrite" $pkgs
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress
      - name: Initialize PG 17 cluster, run suite, and verify pg_upgrade --check to PG 18
        run: |
          sudo install -d -o postgres -g postgres /var/run/postgresql /tmp/pg17 /tmp/pg18 /tmp/pg_upgrade_work

          sudo -u postgres /usr/lib/postgresql/17/bin/initdb \
            -D /tmp/pg17 -U postgres --encoding=UTF8 --locale-provider=libc --locale=C.UTF-8 --data-checksums --auth=trust
          sudo -u postgres /usr/lib/postgresql/17/bin/pg_ctl \
            -D /tmp/pg17 -l /tmp/pg17.log -o "-h 127.0.0.1 -p 55432 -k /tmp/pg17" start
          sudo -u postgres /usr/lib/postgresql/17/bin/createdb \
            -h 127.0.0.1 -p 55432 -U postgres fts_test

          PATH="/usr/lib/postgresql/17/bin:$PATH" \
            FTSPG_TEST_DSN='pgsql:host=127.0.0.1;port=55432;dbname=fts_test;user=postgres' \
            composer test

          index_rows=$(sudo -u postgres /usr/lib/postgresql/17/bin/psql -h 127.0.0.1 -p 55432 -U postgres -d fts_test -tAc "SELECT count(*) FROM ftspg_oc_index")
          words_rows=$(sudo -u postgres /usr/lib/postgresql/17/bin/psql -h 127.0.0.1 -p 55432 -U postgres -d fts_test -tAc "SELECT count(*) FROM ftspg_oc_words")
          marker=$(sudo -u postgres /usr/lib/postgresql/17/bin/psql -h 127.0.0.1 -p 55432 -U postgres -d fts_test -tAc "SELECT col_description(to_regclass('ftspg_oc_index'), attnum) FROM pg_attribute WHERE attrelid = to_regclass('ftspg_oc_index') AND attname = 'tsv' AND NOT attisdropped")
          fn_exists=$(sudo -u postgres /usr/lib/postgresql/17/bin/psql -h 127.0.0.1 -p 55432 -U postgres -d fts_test -tAc "SELECT to_regprocedure('ftspg_oc_regconfig(text)') IS NOT NULL")
          echo "Live PG 17 state: ftspg_oc_index=$index_rows, ftspg_oc_words=$words_rows, marker=$marker, fn=$fn_exists"
          test "$index_rows" -gt 0
          test "$words_rows" -gt 0
          test "$marker" = "ftspg schema 3"
          test "$fn_exists" = "t"

          sudo -u postgres /usr/lib/postgresql/17/bin/pg_ctl -D /tmp/pg17 -m fast stop
          sudo -u postgres /usr/lib/postgresql/18/bin/initdb \
            -D /tmp/pg18 -U postgres --encoding=UTF8 --locale-provider=libc --locale=C.UTF-8 --data-checksums --auth=trust

          set -o pipefail
          sudo -u postgres bash -c '
            set -euo pipefail
            cd /tmp/pg_upgrade_work
            /usr/lib/postgresql/18/bin/pg_upgrade \
              --old-bindir=/usr/lib/postgresql/17/bin \
              --new-bindir=/usr/lib/postgresql/18/bin \
              --old-datadir=/tmp/pg17 \
              --new-datadir=/tmp/pg18 \
              --old-port=55432 \
              --new-port=55432 \
              --socketdir=/tmp/pg_upgrade_work \
              --username=postgres \
              --check
          ' | tee /tmp/pg_upgrade_check.log
          grep -q 'Clusters are compatible' /tmp/pg_upgrade_check.log
