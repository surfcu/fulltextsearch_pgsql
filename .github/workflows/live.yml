name: Live Nextcloud

# Installs a real Nextcloud on PostgreSQL with Full Text Search and the Files provider,
# runs `occ fulltextsearch:test` and indexes and searches real files (tests/live/run.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  live:
    name: Nextcloud ${{ matrix.nextcloud }} / PHP ${{ matrix.php }} / PG ${{ matrix.postgres }} / pg_trgm ${{ matrix.trgm == '1' && 'on' || 'off' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Database owned by the Nextcloud user, as in Nextcloud's install guide: the app
          # must create pg_trgm itself.
          - { nextcloud: '34', server: stable34, fulltextsearch: stable34, files: stable34, php: '8.3', postgres: '16', db: owner, trgm: '1' }
          - { nextcloud: '35', server: stable35, fulltextsearch: master,   files: stable35, php: '8.4', postgres: '17', db: owner, trgm: '1' }
          # Installer creates its own user on a database it does not own: no pg_trgm, the
          # trigram features must switch off cleanly.
          - { nextcloud: '30', server: stable30, fulltextsearch: stable30, files: stable30, php: '8.2', postgres: '13', db: superuser, trgm: '0' }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextcloud
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v5
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server }}
          submodules: true
          path: server
      - name: Checkout this app
        uses: actions/checkout@v5
        with:
          path: server/apps/fulltextsearch_pgsql
      - name: Checkout Full Text Search
        uses: actions/checkout@v5
        with:
          repository: nextcloud/fulltextsearch
          ref: ${{ matrix.fulltextsearch }}
          path: server/apps/fulltextsearch
      - name: Checkout Full Text Search - Files
        uses: actions/checkout@v5
        with:
          repository: nextcloud/files_fulltextsearch
          ref: ${{ matrix.files }}
          path: server/apps/files_fulltextsearch
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_pgsql, pgsql, posix, simplexml, xmlreader, xmlwriter, zip, zlib
          coverage: none
      - name: Build the framework apps' autoloaders
        run: |
          for app in fulltextsearch files_fulltextsearch; do
            composer install --no-dev --no-interaction --no-progress --no-scripts --working-dir=server/apps/$app
          done
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Create the Nextcloud database user
        if: matrix.db == 'owner'
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -c "CREATE USER nextcloud WITH PASSWORD 'nextcloud' CREATEDB"
          psql -c "ALTER DATABASE nextcloud OWNER TO nextcloud"
          psql -d nextcloud -c "GRANT ALL ON SCHEMA public TO nextcloud"
      - name: Run live tests
        working-directory: server
        env:
          DB_USER: ${{ matrix.db == 'owner' && 'nextcloud' || 'postgres' }}
          DB_PASS: ${{ matrix.db == 'owner' && 'nextcloud' || 'postgres' }}
          EXPECT_TRGM: ${{ matrix.trgm }}
        run: |
          set -o pipefail
          apps/fulltextsearch_pgsql/tests/live/run.sh 2>&1 | tee "$RUNNER_TEMP/live.log"
      - name: Report failure details
        if: failure()
        working-directory: server
        # Annotations show up on the pull request and in the API, without opening the logs.
        run: |
          annotate() {
            python3 -c 'import sys; t=sys.stdin.read()[-8000:]; print("::error title=" + sys.argv[1] + "::" + t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "$1"
          }
          grep -aE '^(== |ok |FAIL|   [0-9]+ result|.*(Exception|Error|error|Fatal))' "$RUNNER_TEMP/live.log" | grep -av '^#[0-9]' | head -n 80 | annotate "Live test summary"
          grep -av '^#[0-9]' "$RUNNER_TEMP/live.log" 2>/dev/null | tail -n 40 | annotate "Live test output (last lines)"
          tail -n 40 data/nextcloud.log 2>/dev/null | annotate "nextcloud.log"
